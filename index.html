<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Ayden Nederlands leren</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#263044}
.w{max-width:760px;margin:auto;padding:18px}
h1{font-size:28px;margin:4px 0}
.small{font-size:13px;color:#6d788b;line-height:1.5}
.c{background:#fff;border-radius:22px;padding:20px;box-shadow:0 5px 22px #0001}
button,input{font:inherit}
button{border:0;border-radius:14px;padding:13px;font-size:16px;cursor:pointer}
button:disabled{opacity:.55}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{background:#edf1f7}
.on{background:#263044;color:#fff}
.listen{width:100%;background:#dfeaff;font-size:21px;margin:14px 0}
.pic{text-align:center;background:#fff7df;border-radius:20px;padding:18px;font-size:68px;min-height:110px}
.ans{border:2px dashed #d9dfeb;border-radius:15px;padding:16px;text-align:center;font-size:21px;margin:12px 0;min-height:60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.record{background:#eee2ff}
.record.active{background:#ffdfe4}
.other{background:#edf1f7}
.status{padding:14px;border-radius:14px;margin:12px 0;background:#eef3ff;line-height:1.5}
.ok{background:#e2f6e8}
.near{background:#fff3d3}
.bad{background:#ffe4e4}
.progress{height:10px;background:#e9edf4;border-radius:20px;overflow:hidden;margin-top:14px}
#bar{height:100%;background:#66738b;width:0}
.settings{margin-top:16px;border-top:1px solid #e6eaf0;padding-top:14px}
.settings summary{cursor:pointer;color:#6d788b;font-size:13px}
.setup{margin-top:10px;background:#f7f8fb;border-radius:14px;padding:12px}
.setup input{width:100%;padding:11px;border:1px solid #ccd4e0;border-radius:10px;margin:8px 0}
.setup button{background:#263044;color:white;width:100%}
.diff{margin-top:7px;font-size:15px}
.missing{font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<div class="w">
<h1>Ayden Nederlands leren</h1>
<p class="small">Luisteren · zinnen nazeggen · groep 3</p>

<div class="c">
<div class="tabs">
<button class="tab on" onclick="setLevel(0,this)">Niveau 1 · ±5</button>
<button class="tab" onclick="setLevel(1,this)">Niveau 2 · ±6</button>
<button class="tab" onclick="setLevel(2,this)">Niveau 3 · ±7</button>
<button class="tab" onclick="setLevel(3,this)">Niveau 4 · 8–9</button>
</div>

<p id="count" class="small"></p>
<button class="listen" onclick="speak()">🔊 Luister naar de zin</button>
<div id="pic" class="pic"></div>
<div id="answer" class="ans">Luister eerst. Zeg daarna de hele zin na.</div>

<div class="grid">
<button class="record" onclick="markGood()">✅ Goed gedaan</button>
<button class="other" onclick="speak()">🔁 Nog een keer</button>
<button class="other" onclick="showAnswer()">👀 Laat de zin zien</button>
<button class="other" onclick="next()">➡️ Volgende zin</button>
</div>

<div id="status" class="status">💡 Luister goed en zeg de hele zin hardop na.</div>
<div class="progress"><div id="bar"></div></div>
<p id="stats" class="small"></p>



<p class="small">Geen opname, geen microfoon en geen account nodig.</p>
</div>
</div>


<script>
const S=[[["De hond loopt snel naar huis.", "🐕 🏠"], ["Het meisje pakt haar rode jas.", "👧 🧥"], ["De jongen leest een klein boek.", "👦 📖"], ["Mama zet het eten op tafel.", "👩 🍽️"], ["Papa maakt de grote deur open.", "👨 🚪"], ["Het kind speelt met de bal.", "🧒 ⚽"], ["Zij zoekt haar tas in huis.", "👧 🎒"], ["Hij pakt zijn fiets uit de schuur.", "👦 🚲"], ["De kat ligt op het bed.", "🐈 🛏️"], ["De jongen doet zijn schoenen aan.", "👦 👟"]], [["De jongen pakt zijn blauwe jas.", "👦 🧥"], ["Het meisje zoekt haar tas boven.", "👧 🎒"], ["De hond loopt met papa buiten.", "🐕 👨 🌳"], ["Mama legt het brood op tafel.", "👩 🍞"], ["Hij zet zijn fiets bij school.", "👦 🚲 🏫"], ["Zij leest haar boek op bed.", "👧 📖 🛏️"], ["Het kind drinkt water uit een glas.", "🧒 🥛"], ["De kat slaapt onder de stoel.", "🐈 🪑"], ["De jongen speelt met zijn vriend.", "👦 👦"], ["Het meisje gaat met mama fietsen.", "👧 👩 🚲"]], [["De jongen legt zijn jas op de stoel.", "👦 🧥 🪑"], ["Het meisje gaat met haar vader naar school.", "👧 👨 🏫"], ["De hond loopt achter de jongen naar huis.", "🐕 👦 🏠"], ["Mama zet het warme eten op tafel.", "👩 🍲"], ["Hij neemt zijn blauwe tas mee naar school.", "👦 🎒 🏫"], ["Zij legt haar schoenen naast het bed.", "👧 👟 🛏️"], ["De jongen geeft zijn vriend een rode bal.", "👦 👦 ⚽"], ["Papa maakt een boterham voor het kind.", "👨 🍞 🧒"], ["Mama hangt haar jas aan de kapstok.", "👩 🧥"], ["Zij loopt met haar hond door het park.", "👧 🐕 🌳"]], [["De jongen legt zijn blauwe jas op de stoel.", "👦 🧥 🪑"], ["Het meisje gaat met haar vader naar de winkel.", "👧 👨 🏪"], ["Na school speelt hij met zijn vriend buiten.", "🏫 👦 👦 🌳"], ["De kleine hond loopt achter het meisje naar huis.", "🐕 👧 🏠"], ["Zij pakt haar boek en legt het op tafel.", "👧 📖"], ["Hij neemt zijn tas mee naar de grote school.", "👦 🎒 🏫"], ["Het meisje zet haar schoenen naast het grote bed.", "👧 👟 🛏️"], ["De jongen leest een boek voordat hij gaat slapen.", "👦 📖 🛏️"], ["Zij loopt met haar moeder naar de kleine winkel.", "👧 👩 🏪"], ["Het kind legt het speelgoed terug in de kast.", "🧒 🧸"]]];
let L=0,i=0,good=0,done=0;

const $=x=>document.getElementById(x);
function cur(){ return S[L][i]; }

function update(){
  $('count').textContent=`Zin ${i+1} van ${S[L].length}`;
  $('pic').textContent=cur()[1];
  $('answer').textContent='Luister eerst. Zeg daarna de hele zin na.';
  $('stats').textContent=`Vandaag: ${good} goed · ${done} / ${S[L].length}`;
  $('bar').style.width=(done/S[L].length*100)+'%';
  $('status').className='status';
  $('status').innerHTML='💡 Luister goed en zeg de hele zin hardop na.';
}

window.speak=()=>{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(cur()[0]);
  u.lang='nl-NL';
  u.rate=.82;
  speechSynthesis.speak(u);
};

window.showAnswer=()=>{
  $('answer').textContent=cur()[0];
};

window.next=()=>{
  i=(i+1)%S[L].length;
  update();
};

window.setLevel=(n,b)=>{
  L=n;i=0;good=0;done=0;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  update();
};

window.markGood=()=>{
  good++;
  done=Math.min(done+1,S[L].length);
  $('status').className='status ok';
  $('status').innerHTML='🌟 <b>Heel goed!</b> Ga naar de volgende zin.';
  $('stats').textContent=`Vandaag: ${good} goed · ${done} / ${S[L].length}`;
  $('bar').style.width=(done/S[L].length*100)+'%';
};

update();
</script>

</body>
</html>
